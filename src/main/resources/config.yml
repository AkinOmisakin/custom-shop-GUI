# ---------------------------------------------------------------------------
# Custom Shop GUI - RPG merchants
# ---------------------------------------------------------------------------
# Merchants are NPCs you place in the world with /rpgshop spawn <merchant>.
# Right-click one to open its shop. Everything below describes what they sell.
# Text fields (names, lore, messages) use MiniMessage: <red>, <bold>, <gradient:...>
# Reload with /rpgshop reload after editing this file.

settings:
  # Used by any item that doesn't set its own "currency:".
  default-currency: zombie_coin

  # Window decoration. "border" is the outer frame, "filler" the empty slots inside.
  border: BLACK_STAINED_GLASS_PANE
  filler: GRAY_STAINED_GLASS_PANE

# ---------------------------------------------------------------------------
# Currencies: the coin items players pay with. There is no balance; the coins
# are just items in the player's inventory.
#
# These must match the items dropped by the RPGKillRewardSystem plugin, so
# "material" and "name" here must equal the item "material" and "name" in ITS
# config (write the name WITHOUT colour tags: "<gold>Zombie Coin" -> "Zombie Coin").
#   type:    item (default) or vault
#   name:    item only: the item must have exactly this name (ignoring case).
#            Leave it out and any item of that material counts.
#   display: how the currency is written next to prices (MiniMessage)
# Item prices must be whole numbers; Vault prices may have decimals.
# ---------------------------------------------------------------------------
currencies:
  zombie_coin:
    material: GOLD_NUGGET
    name: "Zombie Coin"
    display: "<gold>Zombie Coin"
  bone_dust:
    material: BONE_MEAL
    name: "Bone Dust"
    display: "<white>Bone Dust"

  # Vault money: pay from the player's balance in any economy plugin that supports
  # Vault (EssentialsX, CMI, ...). Needs the Vault plugin plus an economy plugin installed.
  # Uncomment, then give items "currency: gold" and a price (decimals allowed, e.g. 12.5).
  # gold:
  #   type: vault
  #   display: "<yellow>Gold"

# ---------------------------------------------------------------------------
# Texts. <item>, <price>, <currency> and <have> are filled in automatically.
# ---------------------------------------------------------------------------
messages:
  price-line: "<gray>Price: <gold><price> <currency>"
  can-buy-line: "<green>» Click to buy"
  cannot-buy-line: "<red>✖ You need <price> <currency>"
  bought: "<green>You bought <item><green> for <gold><price> <currency><green>."
  not-enough: "<red>You need <gold><price> <currency><red> but only have <gold><have><red>."
  merchant-gone: "<red>This merchant has left town."
  economy-unavailable: "<red>This merchant can't take payment right now. Tell an admin."

# ---------------------------------------------------------------------------
# Merchants. The id (e.g. "blacksmith") is what you type in /rpgshop spawn.
#
#   npc-name:      name floating above the NPC
#   title:         title of the shop window (defaults to npc-name)
#   greeting:      line sent to the player when they open the shop (optional)
#   entity:        mob type of the NPC (default VILLAGER)
#   profession:    villager outfit: armorer, butcher, cartographer, cleric, farmer,
#                  fisherman, fletcher, leatherworker, librarian, mason, nitwit,
#                  shepherd, toolsmith, weaponsmith (optional, villagers only)
#   villager-type: biome look: desert, jungle, plains, savanna, snow, swamp, taiga
#
# Item fields:
#   material, price (required)   currency (optional, see above)
#   amount: 1                    how many the player gets per purchase
#   name, lore, enchantments     same format as the kill reward plugin
# A window holds 28 items per page; more are split over extra pages.
# ---------------------------------------------------------------------------
merchants:
  blacksmith:
    npc-name: "<gold><bold>Grimnir the Blacksmith"
    title: "<dark_gray>⚔ <gold>Grimnir's Forge"
    greeting: "<gold>Grimnir: <gray>\"Steel's honest, traveller. Coin's better.\""
    profession: weaponsmith
    villager-type: snow
    items:
      iron_sword:
        material: IRON_SWORD
        name: "<white>Forged Blade"
        lore:
          - "<gray>A reliable weapon for"
          - "<gray>any adventurer."
        price: 12
      cursed_edge:
        material: DIAMOND_SWORD
        name: "<dark_red><bold>Grimnir's Cursed Edge"
        lore:
          - "<gray>Hums with a dark hunger."
        enchantments:
          sharpness: 3
          unbreaking: 2
        price: 45
      shield:
        material: SHIELD
        name: "<white>Knight's Bulwark"
        price: 10
      iron_chestplate:
        material: IRON_CHESTPLATE
        name: "<white>Ironclad Cuirass"
        price: 25
      guardian_helm:
        material: IRON_HELMET
        name: "<aqua>Guardian's Helm"
        enchantments:
          protection: 2
        price: 20

  alchemist:
    npc-name: "<light_purple><bold>Mira the Alchemist"
    title: "<dark_purple>⚗ <light_purple>Mira's Curios"
    greeting: "<light_purple>Mira: <gray>\"Bone dust, coins... I'm not picky.\""
    profession: cleric
    villager-type: swamp
    items:
      golden_apple:
        material: GOLDEN_APPLE
        name: "<gold>Elixir of Vitality"
        lore:
          - "<gray>Restores health and grants"
          - "<gray>a brief burst of vigour."
        price: 30
      xp_bottle:
        material: EXPERIENCE_BOTTLE
        name: "<green>Vial of Experience"
        amount: 4
        price: 16
      ender_pearl:
        material: ENDER_PEARL
        name: "<dark_aqua>Blink Stone"
        lore:
          - "<gray>Throw to step through space."
        amount: 2
        price: 24
      bone_arrows:
        material: ARROW
        name: "<white>Bone-Tipped Arrows"
        amount: 16
        currency: bone_dust
        price: 8
      bone_bow:
        material: BOW
        name: "<white>Marrow Bow"
        enchantments:
          power: 2
        currency: bone_dust
        price: 24
